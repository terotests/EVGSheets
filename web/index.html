<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVGSheets</title>
    <meta name="description" content="A spreadsheet editor written in Ranger: the datagrid core with an EVGUI interface, drawn by EVG through WebGL 2." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316a34a' stroke-width='2'%3E%3Crect x='3' y='3' width='18' height='18' rx='1'/%3E%3Cpath d='M3 9h18M3 15h18M9 9v12M15 9v12'/%3E%3C/svg%3E" />
    <style>
      :root { --bg: #e2e8f0; --ink: #0f172a; --muted: #64748b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2937; --ink: #e5e7eb; --muted: #9ca3af; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #app { flex: 1; min-height: 0; position: relative; }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: var(--muted); font-size: 14px; pointer-events: none;
      }
      #error {
        display: none; margin: 16px; padding: 14px; border-radius: 8px;
        background: #2b1d1d; color: #ffd9d9; white-space: pre-wrap;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
    </style>
    <script>globalThis.EVGSHEETS_BUILD = "__BUILD__";</script>
  </head>
  <body>
    <div id="error" role="alert"></div>
    <main id="app" aria-label="EVGSheets editor">
      <div id="loading">Loading the editor…</div>
    </main>
    <script type="module">
      import { mountSheets, optionsFromQuery } from "./evgsheets.mjs?v=__BUILD__";
      const errorEl = document.getElementById("error");
      try {
        const opts = optionsFromQuery();
        const sheet = await mountSheets(document.getElementById("app"), {
          xlsx: "business-workbook.xlsx",
          sheet: "Summary",
          ...opts,
        });
        document.getElementById("loading").remove();
        window.sheet = sheet;
        window.__sheetsReady = true;
      } catch (e) {
        errorEl.style.display = "block";
        errorEl.textContent = "EVGSheets could not start: " + (e && e.message ? e.message : e);
        window.__sheetsError = String(e && e.stack ? e.stack : e);
        throw e;
      }
    </script>
  </body>
</html>
